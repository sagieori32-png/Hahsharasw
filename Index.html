<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8b5a8c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>בוט המדור להכשרה מקצועית | ביה"ס לעבודה סוציאלית - האוניברסיטה העברית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">

<style>
:root {
  --c-primary: #8b5a8c;
  --c-primary-light: #a86fa1;
  --c-coral: #d97a8c;
  --c-gold: #e8b86a;
  --c-bg-soft: #fdf6f0;
  --c-bg-pink: #fef0f5;
  --c-pink-light: #fde5ec;
  --c-pink-pale: #fadbe1;
  --c-cream: #fef7f0;
  --c-text: #3d2b3e;
  --c-text-soft: #8a7a85;
  --c-text-muted: #a8909b;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: 'Heebo', 'Rubik', system-ui, sans-serif;
  background: linear-gradient(135deg, #fef0f5 0%, #fdf6f0 50%, #fef7e8 100%);
  min-height: 100vh;
  color: var(--c-text);
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

.page-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

#bot-wrapper {
  width: 100%;
  max-width: 720px;
  background: linear-gradient(180deg, #fdf6f0 0%, #fef0f5 100%);
  border-radius: 24px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 10px 40px rgba(139, 90, 140, 0.15);
}

/* Header */
.header {
  background: linear-gradient(135deg, #8b5a8c 0%, #d97a8c 60%, #e8b86a 100%);
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: relative;
  overflow: hidden;
}
.header .deco1 {
  position: absolute; top: -20px; right: 30%;
  width: 80px; height: 80px;
  background: rgba(255,255,255,0.15);
  border-radius: 50%;
}
.header .deco2 {
  position: absolute; bottom: -30px; left: 20%;
  width: 100px; height: 100px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.header .logo-wrap {
  display: flex; align-items: center; gap: 12px;
  min-width: 0; position: relative; z-index: 1;
}
.header .logo-box {
  width: 48px; height: 48px;
  border-radius: 14px;
  background: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.header .titles p {
  margin: 0;
  color: white;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.3;
}
.header .titles p.sub {
  color: rgba(255,255,255,0.9);
  font-size: 11px;
  font-weight: 400;
}
.header .titles.left { text-align: left; }
.header .titles.left p { font-size: 12px; }

/* Chat area */
#chat-area {
  padding: 1.5rem 1.25rem;
  min-height: 500px;
  height: 600px;
  overflow-y: auto;
}
#chat-area::-webkit-scrollbar { width: 6px; }
#chat-area::-webkit-scrollbar-track { background: transparent; }
#chat-area::-webkit-scrollbar-thumb {
  background: rgba(217, 122, 140, 0.3);
  border-radius: 3px;
}

/* Animations */
@keyframes dotBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-7px); opacity: 1; }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

/* Typing */
#typing {
  display: none;
  gap: 10px;
  margin-bottom: 16px;
  align-items: flex-end;
}
#typing .bubble {
  background: white;
  padding: 14px 18px;
  border-radius: 22px 22px 22px 6px;
  display: flex; gap: 5px;
  box-shadow: 0 2px 10px rgba(139, 90, 140, 0.08);
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--c-coral);
  animation: dotBounce 1.2s infinite ease-in-out;
}
.dot:nth-child(2) { animation-delay: 0.15s; }
.dot:nth-child(3) { animation-delay: 0.3s; }

/* Messages */
.bot-msg {
  display: flex; gap: 12px;
  margin-bottom: 16px;
  align-items: flex-end;
  animation: slideUp 0.4s ease-out;
}
.avatar-mini {
  width: 44px; height: 44px;
  flex-shrink: 0;
  animation: float 4s ease-in-out infinite;
  border-radius: 50%;
  background: linear-gradient(135deg, #fde5ec 0%, #f5d8c6 100%);
  display: flex; align-items: flex-end; justify-content: center;
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(139, 90, 140, 0.15);
  border: 2.5px solid white;
}

.bot-bubble {
  background: white;
  border-radius: 22px 22px 22px 6px;
  padding: 16px 18px;
  font-size: 15px;
  line-height: 1.7;
  color: var(--c-text);
  max-width: 92%;
  flex: 1;
  box-shadow: 0 2px 12px rgba(139, 90, 140, 0.08);
}
.bot-bubble h4 {
  margin: 0 0 12px 0;
  font-size: 20px;
  font-weight: 700;
  color: var(--c-primary);
  line-height: 1.3;
  letter-spacing: -0.3px;
}
.bot-bubble p { margin: 0 0 10px 0; }
.bot-bubble p:last-child { margin-bottom: 0; }
.bot-bubble ul { margin: 8px 0; padding-inline-start: 22px; }
.bot-bubble li { margin-bottom: 6px; }
.bot-bubble ul li::marker { color: var(--c-coral); }

.user-msg {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 16px;
  animation: slideUp 0.4s ease-out;
}
.user-bubble {
  background: linear-gradient(135deg, #8b5a8c 0%, #a86fa1 100%);
  color: white;
  font-weight: 500;
  padding: 12px 18px;
  border-radius: 22px 22px 6px 22px;
  font-size: 14px;
  max-width: 80%;
  box-shadow: 0 2px 10px rgba(139, 90, 140, 0.2);
}

/* Buttons */
.bot-options {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 14px;
}
.bot-btn {
  background: white;
  border: 2px solid var(--c-pink-pale);
  color: var(--c-primary);
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  text-align: right;
  transition: all 0.2s;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  box-shadow: 0 1px 4px rgba(139, 90, 140, 0.05);
}
.bot-btn:hover {
  background: linear-gradient(135deg, #d97a8c 0%, #e8b86a 100%);
  border-color: transparent;
  color: white;
  transform: translateX(-3px);
  box-shadow: 0 4px 14px rgba(217, 122, 140, 0.3);
}
.bot-btn .arrow { font-size: 18px; }
.bot-btn.back {
  border-color: #e8dde0;
  color: var(--c-text-soft);
  font-size: 13px;
  padding: 10px 14px;
  background: rgba(255,255,255,0.6);
}
.bot-btn.back:hover {
  background: #f0e6ea;
  color: #6b5a6c;
  transform: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.bot-btn.link-btn {
  background: linear-gradient(135deg, #e8b86a 0%, #d97a8c 100%);
  color: white;
  border: none;
  font-weight: 700;
}
.bot-btn.link-btn:hover {
  background: linear-gradient(135deg, #d97a8c 0%, #8b5a8c 100%);
  color: white;
}

/* Hero illustration */
.center-hero {
  width: calc(100% + 36px);
  margin: -16px -18px 16px -18px;
  height: 160px;
  border-radius: 22px 22px 0 0;
  overflow: hidden;
  position: relative;
}

/* Sections */
.section-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 700;
  color: var(--c-coral);
  margin: 18px 0 10px 0;
  padding-bottom: 6px;
  border-bottom: 2px dashed var(--c-pink-pale);
}
.section-label i { font-size: 16px; }

.places-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin: 8px 0;
}
.place-chip {
  background: linear-gradient(135deg, #fef7f0 0%, #fdf0ed 100%);
  border: 1.5px solid var(--c-pink-pale);
  padding: 11px 14px;
  border-radius: 14px;
  font-size: 13.5px;
  font-weight: 500;
  color: #4a3848;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: transform 0.15s;
}
.place-chip:hover {
  transform: translateX(-3px);
  border-color: var(--c-coral);
}
.place-chip .chip-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, #d97a8c 0%, #e8b86a 100%);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.place-chip .chip-icon i {
  color: white;
  font-size: 16px;
}

.contact-card {
  background: linear-gradient(135deg, #fef7f0 0%, #fde5ec 100%);
  border-radius: 16px;
  padding: 14px 16px;
  margin: 12px 0 8px 0;
  border: 1.5px solid var(--c-pink-pale);
}
.contact-card .name {
  font-size: 15px;
  font-weight: 700;
  color: var(--c-primary);
  margin-bottom: 8px;
}
.contact-row {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 13.5px;
  color: #4a3848;
  padding: 4px 0;
  font-weight: 500;
}
.contact-row i {
  color: var(--c-coral);
  font-size: 16px;
  width: 16px;
}

.note-box {
  background: linear-gradient(135deg, #fff8e8 0%, #fde9d9 100%);
  border: 1.5px solid #f5d4a3;
  padding: 12px 14px;
  border-radius: 14px;
  margin: 12px 0;
  font-size: 13.5px;
  color: #6b4a0a;
  font-weight: 500;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.note-box i {
  color: #c9a040;
  font-size: 18px;
  margin-top: 1px;
  flex-shrink: 0;
}

/* Year stages (for community center) */
.stage-card {
  background: linear-gradient(135deg, #fef7f0 0%, #fde9d4 100%);
  border: 1.5px solid #fadbe1;
  border-radius: 14px;
  padding: 13px 14px;
  margin-bottom: 10px;
  position: relative;
}
.stage-tag {
  display: inline-block;
  background: linear-gradient(135deg, #d97a8c 0%, #e8b86a 100%);
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 8px;
  margin-bottom: 8px;
  letter-spacing: 0.3px;
}
.stage-title {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--c-primary);
  margin-bottom: 6px;
}
.stage-text {
  font-size: 13.5px;
  margin: 0 0 8px 0;
  color: #4a3848;
  line-height: 1.55;
}
.stage-examples {
  font-size: 12.5px;
  margin: 0;
  color: #6b4a0a;
  background: rgba(255,255,255,0.5);
  padding: 8px 10px;
  border-radius: 9px;
  display: flex;
  gap: 6px;
  align-items: flex-start;
  border-inline-start: 2px solid #e8b86a;
}
.stage-examples i {
  color: #c9a040;
  font-size: 14px;
  margin-top: 2px;
  flex-shrink: 0;
}

.staff-card {
  background: white;
  border: 1.5px solid var(--c-pink-pale);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  gap: 14px;
  box-shadow: 0 2px 10px rgba(139, 90, 140, 0.05);
}
.staff-card .staff-icon {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  flex-shrink: 0;
  background: linear-gradient(135deg, #d97a8c 0%, #e8b86a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 10px rgba(217, 122, 140, 0.25);
}
.staff-card .staff-icon i {
  color: white;
  font-size: 28px;
}
.staff-card .info { flex: 1; min-width: 0; }
.staff-card .info h5 {
  margin: 0 0 3px 0;
  color: var(--c-primary);
  font-size: 16px;
  font-weight: 700;
}
.staff-card .role {
  font-size: 12px;
  color: var(--c-text-muted);
  margin-bottom: 10px;
  font-weight: 500;
}

.welcome-emoji {
  font-size: 22px;
  display: inline-block;
  animation: float 2s ease-in-out infinite;
}

/* Smart search box */
.search-wrapper {
  margin: 14px 0 8px 0;
  background: linear-gradient(135deg, #fef7f0 0%, #fde5ec 100%);
  border: 1.5px solid var(--c-pink-pale);
  border-radius: 18px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
}
.search-wrapper:focus-within {
  border-color: var(--c-coral);
  box-shadow: 0 0 0 3px rgba(217, 122, 140, 0.15);
}
.search-input {
  flex: 1;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  color: var(--c-text);
  padding: 6px 4px;
  outline: none;
  min-width: 0;
}
.search-input::placeholder {
  color: var(--c-text-muted);
  font-weight: 400;
}
.search-btn {
  border: none;
  background: white;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  box-shadow: 0 1px 3px rgba(139, 90, 140, 0.1);
}
.search-btn i {
  color: var(--c-primary);
  font-size: 18px;
}
.search-btn:hover {
  background: var(--c-coral);
  transform: scale(1.05);
}
.search-btn:hover i { color: white; }
.search-btn.send {
  background: linear-gradient(135deg, #d97a8c 0%, #e8b86a 100%);
}
.search-btn.send i { color: white; }
.search-btn.send:hover {
  background: linear-gradient(135deg, #c44060 0%, #d97a8c 100%);
}
.search-btn.recording {
  background: #e84a6a;
  animation: recordPulse 1s ease-in-out infinite;
}
.search-btn.recording i { color: white; }
@keyframes recordPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(232, 74, 106, 0.6); }
  50% { box-shadow: 0 0 0 8px rgba(232, 74, 106, 0); }
}

.search-hint {
  font-size: 11.5px;
  color: var(--c-text-muted);
  text-align: center;
  margin: 4px 0 0 0;
  font-weight: 400;
}
.search-divider {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 14px 0 6px 0;
  color: var(--c-text-muted);
  font-size: 11.5px;
  font-weight: 500;
}
.search-divider::before,
.search-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--c-pink-pale);
}

.search-result-hint {
  background: linear-gradient(135deg, #fff8e8 0%, #fde9d9 100%);
  border: 1.5px dashed #f5d4a3;
  border-radius: 12px;
  padding: 10px 12px;
  margin: 0 0 12px 0;
  font-size: 13px;
  color: #6b4a0a;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.search-result-hint i { color: #c9a040; font-size: 16px; flex-shrink: 0; margin-top: 1px; }

/* Footer */
.footer {
  padding: 12px 20px;
  text-align: center;
  font-size: 11px;
  color: var(--c-text-muted);
  background: rgba(255,255,255,0.5);
  border-top: 1px solid var(--c-pink-pale);
}
.footer a {
  color: var(--c-primary);
  text-decoration: none;
  font-weight: 500;
}
.footer a:hover { text-decoration: underline; }

/* Mobile - tablets and smaller */
@media (max-width: 768px) {
  .page-wrapper { padding: 0; }
  #bot-wrapper {
    border-radius: 0;
    min-height: 100vh;
    max-width: 100%;
    box-shadow: none;
  }
  #chat-area {
    height: calc(100dvh - 145px);
    min-height: calc(100dvh - 145px);
    padding: 1rem 0.875rem;
  }
  .header { padding: 0.875rem 1rem; gap: 8px; }
  .header .logo-box {
    width: 40px;
    height: 40px;
    border-radius: 11px;
  }
  .header .logo-box svg { width: 26px; height: 26px; }
  .header .titles p { font-size: 13px; line-height: 1.25; }
  .header .titles p.sub { font-size: 10px; line-height: 1.25; }
  .header .titles.left p { font-size: 11px; }

  .bot-msg { gap: 8px; margin-bottom: 14px; }
  .avatar-mini {
    width: 36px;
    height: 36px;
    border-width: 2px;
  }
  .avatar-mini svg { width: 36px; height: 36px; }

  .bot-bubble {
    padding: 14px 14px;
    font-size: 14.5px;
    line-height: 1.65;
    border-radius: 18px 18px 18px 4px;
    max-width: calc(100% - 44px);
  }
  .bot-bubble h4 {
    font-size: 18px;
    margin-bottom: 10px;
  }

  .user-bubble {
    padding: 10px 14px;
    font-size: 14px;
    border-radius: 18px 18px 4px 18px;
    max-width: 85%;
  }

  .center-hero {
    width: calc(100% + 28px);
    margin: -14px -14px 14px -14px;
    height: 130px;
    border-radius: 18px 18px 0 0;
  }

  .section-label {
    font-size: 13px;
    margin: 14px 0 8px 0;
  }

  .place-chip {
    padding: 10px 12px;
    font-size: 13px;
    gap: 9px;
  }
  .place-chip .chip-icon {
    width: 30px;
    height: 30px;
    border-radius: 9px;
  }
  .place-chip .chip-icon i { font-size: 15px; }

  .contact-card {
    padding: 12px 14px;
    border-radius: 14px;
  }
  .contact-card .name { font-size: 14.5px; }
  .contact-row { font-size: 13px; }

  .note-box {
    padding: 10px 12px;
    font-size: 12.5px;
    border-radius: 12px;
  }

  .staff-card {
    padding: 14px;
    gap: 12px;
    border-radius: 16px;
  }
  .staff-card .staff-icon {
    width: 48px;
    height: 48px;
    border-radius: 13px;
  }
  .staff-card .staff-icon i { font-size: 24px; }
  .staff-card .info h5 { font-size: 15px; }
  .staff-card .role { font-size: 11.5px; }

  .bot-btn {
    padding: 11px 14px;
    font-size: 13.5px;
    border-radius: 14px;
    border-width: 1.5px;
  }
  .bot-btn .arrow { font-size: 16px; }
  .bot-btn.back {
    padding: 9px 12px;
    font-size: 12.5px;
  }

  .footer {
    font-size: 10px;
    padding: 10px 14px;
  }
}

/* Extra small mobile - phones under 380px */
@media (max-width: 380px) {
  .header { padding: 0.75rem 0.875rem; }
  .header .titles p { font-size: 12px; }
  .header .titles p.sub { font-size: 9.5px; }
  .header .titles.left { display: none; }
  .bot-bubble { font-size: 14px; padding: 12px 13px; }
  .bot-bubble h4 { font-size: 17px; }
  .center-hero { height: 115px; }
}
</style>
</head>
<body>
<div class="page-wrapper">
<div id="bot-wrapper">

<!-- Header -->
<div class="header">
  <div class="deco1"></div>
  <div class="deco2"></div>

  <div class="logo-wrap">
    <div class="logo-box">
      <svg width="32" height="32" viewBox="0 0 42 42">
        <defs>
          <linearGradient id="logo-g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b5a8c"/>
            <stop offset="1" stop-color="#d97a8c"/>
          </linearGradient>
        </defs>
        <path d="M21 6 C14 6 10 11 10 18 C10 24 14 28 21 28 C28 28 32 24 32 18 C32 11 28 6 21 6 Z" fill="url(#logo-g1)"/>
        <circle cx="21" cy="17" r="3" fill="white"/>
        <path d="M14 24 Q21 28 28 24" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M15 30 L15 36 M27 30 L27 36 M21 28 L21 36" stroke="#e8b86a" stroke-width="2" stroke-linecap="round"/>
      </svg>

// Normalize Hebrew text: remove niqqud, lowercase, normalize quotes
function normalize(text) {
  return text
    .toLowerCase()
    .replace(/[\u0591-\u05C7]/g, '') // remove niqqud
    .replace(/["'\u05f4\u05f3]/g, '"')
    .replace(/[\u05be\u2013\u2014]/g, '-')
    .replace(/\s+/g, ' ')
    .trim();
}

// Strip common Hebrew prefixes (ב ל מ ה ו כ ש) and suffixes (ים ות ית) to get word stem
function hebrewStem(word) {
  if (!word || word.length < 3) return word;
  var w = word;
  if (w.length > 3 && 'בלמהוכש'.indexOf(w[0]) !== -1) w = w.slice(1);
  if (w.length > 4 && w.endsWith('ים')) return w.slice(0, -2);
  if (w.length > 4 && w.endsWith('ות')) return w.slice(0, -2);
  if (w.length > 4 && w.endsWith('ית')) return w.slice(0, -2);
  return w;
}

// Detect greetings / very vague single-word queries
function isVagueQuery(query) {
  var vague = ['שלום', 'היי', 'הי', 'בוקר טוב', 'ערב טוב'];
  var n = normalize(query);
  return vague.some(function(v) { return n === normalize(v); }) && query.trim().length < 20;
}

// Score how well a query matches a topic
function scoreMatch(query, keywords) {
  var nQuery = normalize(query);
  var queryWords = nQuery.split(/\s+/).filter(function(w) { return w.length > 1; });
  var queryStems = queryWords.map(hebrewStem);

  var score = 0;
  var matches = [];

  for (var i = 0; i < keywords.length; i++) {
    var kw = keywords[i];
    var nKw = normalize(kw);
    if (nKw.length < 2) continue;

    // 1. Exact phrase match — highest weight
    if (nQuery.includes(nKw)) {
      var weight = Math.max(1, nKw.split(' ').length * 2) + (nKw.length / 5);
      score += weight;
      matches.push(kw);
      continue;
    }

    // 2. Stem-level word matching — catches prefix/suffix morphological variations
    var kwWords = nKw.split(/\s+/).filter(function(w) { return w.length > 1; });
    var kwStems = kwWords.map(hebrewStem);
    var stemHits = 0;

    for (var qi = 0; qi < queryStems.length; qi++) {
      var qs = queryStems[qi];
      if (qs.length < 3) continue;
      for (var ki = 0; ki < kwStems.length; ki++) {
        var ks = kwStems[ki];
        if (ks.length < 3) continue;
        if (qs === ks) { stemHits += 1.2; break; }
        if (qs.length >= 4 && ks.length >= 4 && (qs.includes(ks) || ks.includes(qs))) {
          stemHits += 0.7; break;
        }
      }
    }

    if (stemHits > 0) {
      score += stemHits * (kwWords.length > 1 ? 1.3 : 1);
      matches.push(kw);
    }
  }

  return { score: score, matches: matches };
}

// Find best matching topics
function searchKnowledge(query) {
  if (!query || !query.trim()) return [];
  var results = knowledgeMap.map(function(item) {
    var res = scoreMatch(query, item.keywords);
    return Object.assign({}, item, { score: res.score, matches: res.matches });
  }).filter(function(r) { return r.score > 0; })
    .sort(function(a, b) { return b.score - a.score; });
  return results;
}

function routeToTopic(result) {
  if (result.type === "info") {
    if (result.topic === "general") {
      botMessage(data.general.content, [
        { label: "למידע נוסף באתר ביה\"ס", url: data.general.link },
        { label: "חזרה לתפריט הראשי", value: "main", back: true }
      ]);
    } else if (result.topic === "contact") {
      showContact();
    }
  } else if (result.type === "track") {
    showCenters(result.topic);
  } else if (result.type === "center") {
    showCenterInfo(result.track, result.topic);
  }
}

// Answer specific factual questions directly from data without routing

function directAnswer(query) {
  var n = normalize(query);

  // Detect question type
  var askingCoord  = n.includes('מי הרכז') || n.includes('רכז') || n.includes('מנהל') || n.includes('אחראי');
  var askingPhone  = n.includes('טלפון') || n.includes('מספר') || n.includes('לטלפן') || n.includes('להתקשר');
  var askingMail   = n.includes('מייל') || n.includes('אימייל') || n.includes('אי-מייל') || n.includes('כתובת מייל');
  var askingExists = n.includes('יש') || n.includes('האם') || n.includes('אפשר') || n.includes('ניתן');

  if (!askingCoord && !askingPhone && !askingMail) return null;

  // Find which center the question is about
  var matchedId = null;
  var bestScore = 0;
  for (var cid in data.centersInfo) {
    var cinfo = data.centersInfo[cid];
    var nameNorm = normalize(cinfo.name || '');
    // Simple overlap check
    var words = nameNorm.split(' ').filter(function(w){ return w.length > 2; });
    var hits = words.filter(function(w){ return n.includes(w); }).length;
    if (hits > bestScore) { bestScore = hits; matchedId = cid; }
  }
  // Also match by knowledgeMap
  var kmResults = searchKnowledge(query).filter(function(r){ return r.type === 'center'; });
  if (kmResults.length > 0 && kmResults[0].score > bestScore * 2) {
    matchedId = kmResults[0].topic;
  }

  if (!matchedId) return null;
  var info = data.centersInfo[matchedId];
  if (!info) return null;

  // Build inline answer
  if (askingPhone) {
    return `<h4>טלפון — ${info.name}</h4>
            <div class="contact-card">
              <div class="contact-row"><i class="ti ti-phone"></i> ${info.phone}</div>
              <div class="contact-row"><i class="ti ti-user-circle"></i> ${info.coordinator}</div>
            </div>`;
  }
  if (askingMail) {
    return `<h4>מייל — ${info.name}</h4>
            <div class="contact-card">
              <div class="contact-row"><i class="ti ti-mail"></i> ${info.email}</div>
              <div class="contact-row"><i class="ti ti-user-circle"></i> ${info.coordinator}</div>
            </div>`;
  }
  if (askingCoord) {
    return `<h4>רכז/ת — ${info.name}</h4>
            <div class="contact-card">
              <div class="name">${info.coordinator}</div>
              <div class="contact-row"><i class="ti ti-phone"></i> ${info.phone}</div>
              <div class="contact-row"><i class="ti ti-mail"></i> ${info.email}</div>
            </div>`;
  }
  return null;
}

// ===================== Speech Recognition =====================
let recognition = null;
let isRecording = false;

function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return null;
  const rec = new SpeechRecognition();
  rec.lang = 'he-IL';
  rec.continuous = true;       // keep listening through pauses
  rec.interimResults = true;   // show text as user speaks
  rec.maxAlternatives = 1;
  return rec;
}

function toggleRecording(inputEl, micBtn) {
  if (isRecording) {
    // Stop recording
    if (recognition) recognition.stop();
    stopRecording(micBtn);
    // Auto-submit what was captured
    setTimeout(() => {
      const q = inputEl.value.trim();
      if (q) { inputEl.value = ''; handleSearch(q); }
    }, 300);
    return;
  }

  // Start fresh recognition each time (browser quirk: reuse can break)
  recognition = initSpeechRecognition();
  if (!recognition) {
    botMessage(
      '<p>הקלטה קולית אינה נתמכת בדפדפן זה. נסו Chrome או Safari.</p>',
      [{ label: "חזרה לתפריט הראשי", value: "main", back: true }]
    );
    return;
  }

  let finalTranscript = '';
  let silenceTimer = null;

  recognition.onstart = () => {
    isRecording = true;
    micBtn.classList.add('recording');
    const icon = micBtn.querySelector('i');
    if (icon) { icon.classList.remove('ti-microphone'); icon.classList.add('ti-player-stop-filled'); }
    inputEl.placeholder = 'מקשיב...';
  };

  recognition.onresult = (event) => {
    let interim = '';
    finalTranscript = '';
    for (let i = 0; i < event.results.length; i++) {
      if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
      else interim += event.results[i][0].transcript;
    }
    inputEl.value = finalTranscript || interim;

    // Auto-submit after 2 seconds of silence
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => {
      if (isRecording && inputEl.value.trim()) {
        if (recognition) recognition.stop();
      }
    }, 2000);
  };

  recognition.onend = () => {
    clearTimeout(silenceTimer);
    stopRecording(micBtn);
    inputEl.placeholder = 'כתבו או הקליטו שאלה...';
    const q = inputEl.value.trim();
    if (q) { inputEl.value = ''; handleSearch(q); }
  };

  recognition.onerror = (event) => {
    clearTimeout(silenceTimer);
    stopRecording(micBtn);
    inputEl.placeholder = 'כתבו או הקליטו שאלה...';
    if (event.error === 'not-allowed') {
      botMessage(
        '<p>⚠️ אנא אפשרו גישה למיקרופון בהגדרות הדפדפן.</p>',
        [{ label: "חזרה לתפריט הראשי", value: "main", back: true }]
      );
    }
  };

  try {
    recognition.start();
  } catch(e) {
    stopRecording(micBtn);
    inputEl.placeholder = 'כתבו או הקליטו שאלה...';
  }
}

function stopRecording(micBtn) {
  isRecording = false;
  if (micBtn) {
    micBtn.classList.remove('recording');
    const icon = micBtn.querySelector('i');
    if (icon) {
      icon.classList.remove('ti-player-stop-filled');
      icon.classList.add('ti-microphone');
    }
  }
}

// Wire up the search box after it's added to the DOM
function wireSearchBox() {
  const input = document.getElementById('search-input');
  const sendBtn = document.getElementById('search-send');
  const micBtn = document.getElementById('search-mic');
  if (!input || !sendBtn || !micBtn) return;

  const submit = () => {
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    handleSearch(q);
  };

  sendBtn.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      submit();
    }
  });
  micBtn.addEventListener('click', () => toggleRecording(input, micBtn));

  // Hide mic if not supported
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    micBtn.style.display = 'none';
  }
}

  document.querySelectorAll('#typing .avatar-mini').forEach(el => {
    if (!el.innerHTML.trim()) el.innerHTML = makeAvatar(44);
  });
}

function scrollDown() {
  setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
}

// Scroll the new bot message to the TOP of the visible area
// so user sees the heading/hero image first, not the buttons at the bottom
function scrollToMessage(el) {
  if (!el) return;
  setTimeout(() => {
    const containerTop = chatArea.getBoundingClientRect().top;
    const msgTop = el.getBoundingClientRect().top;
    const offset = msgTop - containerTop + chatArea.scrollTop - 12;
    chatArea.scrollTo({ top: offset, behavior: 'smooth' });
  }, 80);
}

function showTyping() {
  initAvatars();
  typingEl.style.display = 'flex';
  scrollDown();
}

function hideTyping() {
  typingEl.style.display = 'none';
}

function openLink(url) {
  window.open(url, '_blank', 'noopener,noreferrer');
}

function botMessage(html, options, delay) {
  delay = delay || 700;
  showTyping();
  setTimeout(() => {
    hideTyping();
    const msg = document.createElement('div');
    msg.className = 'bot-msg';
    let optsHtml = '';
    if (options && options.length) {
      optsHtml = '<div class="bot-options">' + options.map(o => {
        if (o.url) {
          return `<button class="bot-btn link-btn" onclick="openLink('${o.url}')">
            <span>${o.label}</span>
            <i class="ti ti-external-link arrow"></i>
          </button>`;
        }
        return `<button class="bot-btn ${o.back ? 'back' : ''}" onclick="handleChoice('${o.value}')">
          <span>${o.label}</span>
          <i class="ti ti-${o.back ? 'arrow-right' : 'chevron-left'} arrow"></i>
        </button>`;
      }).join('') + '</div>';
    }
    msg.innerHTML = `
      <div class="avatar-mini">${makeAvatar(44)}</div>
      <div class="bot-bubble">${html}${optsHtml}</div>
    `;
    messagesEl.appendChild(msg);
    // Scroll so the TOP of the new message is visible (heading + hero image first)
    scrollToMessage(msg);
  }, delay);
}

function userMessage(text) {
  const msg = document.createElement('div');
  msg.className = 'user-msg';
  msg.innerHTML = `<div class="user-bubble">${text}</div>`;
  messagesEl.appendChild(msg);
  scrollDown();
}

function showMainMenu() {
  botMessage(
    `<h4>שלום וברוכים הבאים <span class="welcome-emoji">👋</span></h4>
     <p>אני <strong>מאיה</strong>, ואני כאן כדי לתת לכם מידע על המדור להכשרה מקצועית בבית הספר לעבודה סוציאלית באוניברסיטה העברית.</p>

     <div class="search-wrapper">
       <input type="text" class="search-input" id="search-input" placeholder="כתבו או הקליטו שאלה..." autocomplete="off" />
       <button class="search-btn" id="search-mic" title="הקלטה קולית" aria-label="הקלטה קולית">
         <i class="ti ti-microphone"></i>
       </button>
       <button class="search-btn send" id="search-send" title="שלח" aria-label="שלח שאלה">
         <i class="ti ti-arrow-left"></i>
       </button>
     </div>
     <p class="search-hint">💡 לדוגמה: "אני מעוניין בעבודה עם נוער" או "מה זה ההכשרה?"</p>

     <div class="search-divider">או בחרו מהתפריט</div>`,
    [
      { label: "מידע על ההכשרה המקצועית", value: "general" },
      { label: "המגמה הפרטנית", value: "partani" },
      { label: "המגמה הקהילתית", value: "kehilatit" },
      { label: "יצירת קשר עם המדור", value: "contact" }
    ],
    400
  );
  // Wire up search box after it's rendered
  setTimeout(wireSearchBox, 1000);
}

function showCenters(track) {
  const t = data[track];
  botMessage(
    t.description,
    [
      ...t.centers.map(c => ({ label: c.name, value: `center:${track}:${c.id}` })),
      { label: "חזרה לתפריט הראשי", value: "main", back: true }
    ]
  );
}

function showCenterInfo(track, centerId) {
  const info = data.centersInfo[centerId];
  if (!info) return;

  let placesHtml = '';
  if (info.places && info.places.length) {
    placesHtml = `
      <div class="section-label"><i class="ti ti-building"></i> מקומות הכשרה לדוגמה</div>
      <div class="places-grid">
        ${info.places.map(p => `
          <div class="place-chip">
            <div class="chip-icon"><i class="ti ${p.icon}"></i></div>
            <span>${p.name}</span>
          </div>
        `).join('')}
      </div>`;
  }

  // Year stages (for the community center)
  let stagesHtml = '';
  if (info.yearB || info.yearC) {
    stagesHtml = `<div class="section-label"><i class="ti ti-stairs"></i> שלבי ההכשרה</div>`;
    if (info.yearB) {
      stagesHtml += `
        <div class="stage-card">
          <div class="stage-tag">שנה ב'</div>
          <div class="stage-title">${info.yearB.title.replace(/^שנה ב' — /, '')}</div>
          <p class="stage-text">${info.yearB.text}</p>
          ${info.yearB.examples ? `<p class="stage-examples"><i class="ti ti-map-pin"></i> ${info.yearB.examples}</p>` : ''}
        </div>`;
    }
    if (info.yearC) {
      stagesHtml += `
        <div class="stage-card">
          <div class="stage-tag">שנה ג'</div>
          <div class="stage-title">${info.yearC.title.replace(/^שנה ג' — /, '')}</div>
          <p class="stage-text">${info.yearC.text}</p>
        </div>`;
    }
  }

  let noteHtml = '';
  if (info.note) {
    noteHtml = `<div class="note-box"><i class="ti ti-info-circle"></i><span>${info.note}</span></div>`;
  }

  const subtitle = info.subtitle ? `<p style="font-size: 13px; color: #8a7a85; margin: -8px 0 12px 0; font-weight: 500;">${info.subtitle}</p>` : '';
  const hero = heroSVG[info.icon] || '';

  // Determine back button text
  const backLabel = track === 'kehilatit' ? "חזרה לתפריט הראשי" : "חזרה לרשימת המרכזים";
  const backValue = track === 'kehilatit' ? 'main' : `back:${track}`;

  const backOptions = [
    { label: "למידע נוסף באתר ביה\"ס", url: info.link },
    { label: backLabel, value: backValue, back: true }
  ];
  if (track !== 'kehilatit') {
    backOptions.push({ label: "חזרה לתפריט הראשי", value: "main", back: true });
  }

  botMessage(
    `<div class="center-hero">${hero}</div>
     <h4>${info.name}</h4>
     ${subtitle}
     <p>${info.desc}</p>
     ${stagesHtml}
     ${placesHtml}
     ${noteHtml}
     <div class="section-label"><i class="ti ti-user-circle"></i> רכז/ת המרכז</div>
     <div class="contact-card">
       <div class="name">${info.coordinator}</div>
       <div class="contact-row"><i class="ti ti-phone"></i> ${info.phone}</div>
       <div class="contact-row"><i class="ti ti-mail"></i> ${info.email}</div>
     </div>`,
    backOptions
  );
}

function showContact() {
  botMessage(
    `<h4>יצירת קשר עם המדור</h4>
    <p>נשמח לעמוד לרשותכם לכל שאלה. צוות המדור:</p>

    <div class="staff-card">
      <div class="staff-icon">
        <i class="ti ti-user-star"></i>
      </div>
      <div class="info">
        <h5>פרופ' איריס צדוק</h5>
        <div class="role">ראשת המדור להכשרה מקצועית</div>
        <div class="contact-row"><i class="ti ti-map-pin"></i> חדר 316</div>
        <div class="contact-row"><i class="ti ti-calendar"></i> בתיאום מראש</div>
        <div class="contact-row"><i class="ti ti-mail"></i> iris.zadok@mail.huji.ac.il</div>
      </div>
    </div>

    <div class="staff-card">
      <div class="staff-icon">
        <i class="ti ti-headset"></i>
      </div>
      <div class="info">
        <h5>גב' מירי בן הרוש</h5>
        <div class="role">רכזת המדור להכשרה מקצועית</div>
        <div class="contact-row"><i class="ti ti-map-pin"></i> חדר 316</div>
        <div class="contact-row"><i class="ti ti-phone"></i> 02-5882105</div>
        <div class="contact-row"><i class="ti ti-printer"></i> פקס: 02-5882107</div>
        <div class="contact-row"><i class="ti ti-clock"></i> א'-ה' 8:00-13:30</div>
        <div class="contact-row"><i class="ti ti-mail"></i> miribe@savion.huji.ac.il</div>
      </div>
    </div>

    <div class="note-box">
      <i class="ti ti-building"></i>
      <span><strong>כתובת:</strong> ביה"ס לעבודה סוציאלית ע"ש פאול ברוואלד, האוניברסיטה העברית, הר הצופים, ירושלים.</span>
    </div>`,
    [
      { label: "אתר המדור להכשרה מקצועית", url: "https://sw.huji.ac.il/book/%D7%94%D7%9B%D7%A9%D7%A8%D7%94-%D7%9E%D7%A7%D7%A6%D7%95%D7%A2%D7%99%D7%AA-0" },
      { label: "חזרה לתפריט הראשי", value: "main", back: true }
    ]
  );
}

function handleChoice(value) {
  if (value === 'general') {
    userMessage("מידע על ההכשרה המקצועית");
    botMessage(data.general.content, [
      { label: "למידע נוסף באתר ביה\"ס", url: data.general.link },
      { label: "חזרה לתפריט הראשי", value: "main", back: true }
    ]);
  } else if (value === 'partani') {
    userMessage("המגמה הפרטנית");
    showCenters('partani');
  } else if (value === 'kehilatit') {
    userMessage("המגמה הקהילתית");
    showCenters('kehilatit');
  } else if (value === 'contact') {
    userMessage("יצירת קשר עם המדור");
    showContact();
  } else if (value === 'main') {
    showMainMenu();
  } else if (value.startsWith('search:')) {
    // Format: search:topic:type:track
    const parts = value.split(':');
    const topic = parts[1];
    const type = parts[2];
    const track = parts[3];
    const result = { topic, type, track };
    routeToTopic(result);
  } else if (value.startsWith('back:')) {
    const track = value.split(':')[1];
    showCenters(track);
  } else if (value.startsWith('center:')) {
    const [, track, centerId] = value.split(':');
    const center = data[track].centers.find(c => c.id === centerId);
    userMessage(center.name);
    showCenterInfo(track, centerId);
  }
}

// Start the bot
setTimeout(showMainMenu, 200);
</script>
