<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8b5a8c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>בוט המדור להכשרה מקצועית | ביה"ס לעבודה סוציאלית - האוניברסיטה העברית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">

<style>
:root {
  --c-primary: #8b5a8c;
  --c-primary-light: #a86fa1;
  --c-coral: #d97a8c;
  --c-gold: #e8b86a;
  --c-bg-soft: #fdf6f0;
  --c-bg-pink: #fef0f5;
  --c-pink-light: #fde5ec;
  --c-pink-pale: #fadbe1;
  --c-cream: #fef7f0;
  --c-text: #3d2b3e;
  --c-text-soft: #8a7a85;
  --c-text-muted: #a8909b;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: 'Heebo', 'Rubik', system-ui, sans-serif;
  background: linear-gradient(135deg, #fef0f5 0%, #fdf6f0 50%, #fef7e8 100%);
  min-height: 100vh;
  color: var(--c-text);
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

.page-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

#bot-wrapper {
  width: 100%;
  max-width: 720px;
  background: linear-gradient(180deg, #fdf6f0 0%, #fef0f5 100%);
  border-radius: 24px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 10px 40px rgba(139, 90, 140, 0.15);
}

/* Header */
.header {
  background: linear-gradient(135deg, #8b5a8c 0%, #d97a8c 60%, #e8b86a 100%);
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: relative;
  overflow: hidden;
}
.header .deco1 {
  position: absolute; top: -20px; right: 30%;
  width: 80px; height: 80px;
  background: rgba(255,255,255,0.15);
  border-radius: 50%;
}
.header .deco2 {
  position: absolute; bottom: -30px; left: 20%;
  width: 100px; height: 100px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.header .logo-wrap {
  display: flex; align-items: center; gap: 12px;
  min-width: 0; position: relative; z-index: 1;
}
.header .logo-box {
  width: 48px; height: 48px;
  border-radius: 14px;
  background: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.header .titles p {
  margin: 0;
  color: white;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.3;
}
.header .titles p.sub {
  color: rgba(255,255,255,0.9);
  font-size: 11px;
  font-weight: 400;
}
.header .titles.left { text-align: left; }
.header .titles.left p { font-size: 12px; }

/* Chat area */
#chat-area {
  padding: 1.5rem 1.25rem;
  min-height: 500px;
  height: 600px;
  overflow-y: auto;
}
#chat-area::-webkit-scrollbar { width: 6px; }
#chat-area::-webkit-scrollbar-track { background: transparent; }
#chat-area::-webkit-scrollbar-thumb {
  background: rgba(217, 122, 140, 0.3);
  border-radius: 3px;
}

/* Animations */
@keyframes dotBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-7px); opacity: 1; }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

/* Typing */
#typing {
  display: none;
  gap: 10px;
  margin-bottom: 16px;
  align-items: flex-end;
}
#typing .bubble {
  background: white;
  padding: 14px 18px;
  border-radius: 22px 22px 22px 6px;
  display: flex; gap: 5px;
  box-shadow: 0 2px 10px rgba(139, 90, 140, 0.08);
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--c-coral);
  animation: dotBounce 1.2s infinite ease-in-out;
}
.dot:nth-child(2) { animation-delay: 0.15s; }
.dot:nth-child(3) { animation-delay: 0.3s; }

/* Messages */
.bot-msg {
  display: flex; gap: 12px;
  margin-bottom: 16px;
  align-items: flex-end;
  animation: slideUp 0.4s ease-out;
}
.avatar-mini {
  width: 44px; height: 44px;
  flex-shrink: 0;
  animation: float 4s ease-in-out infinite;
  border-radius: 50%;
  background: linear-gradient(135deg, #fde5ec 0%, #f5d8c6 100%);
  display: flex; align-items: flex-end; justify-content: center;
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(139, 90, 140, 0.15);
  border: 2.5px solid white;
}

.bot-bubble {
  background: white;
  border-radius: 22px 22px 22px 6px;
  padding: 16px 18px;
  font-size: 15px;
  line-height: 1.7;
  color: var(--c-text);
  max-width: 92%;
  flex: 1;
  box-shadow: 0 2px 12px rgba(139, 90, 140, 0.08);
}
.bot-bubble h4 {
  margin: 0 0 12px 0;
  font-size: 20px;
  font-weight: 700;
  color: var(--c-primary);
  line-height: 1.3;
  letter-spacing: -0.3px;
}
.bot-bubble p { margin: 0 0 10px 0; }
.bot-bubble p:last-child { margin-bottom: 0; }
.bot-bubble ul { margin: 8px 0; padding-inline-start: 22px; }
.bot-bubble li { margin-bottom: 6px; }
.bot-bubble ul li::marker { color: var(--c-coral); }

.user-msg {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 16px;
  animation: slideUp 0.4s ease-out;
}
.user-bubble {
  background: linear-gradient(135deg, #8b5a8c 0%, #a86fa1 100%);
  color: white;
  font-weight: 500;
  padding: 12px 18px;
  border-radius: 22px 22px 6px 22px;
  font-size: 14px;
  max-width: 80%;
  box-shadow: 0 2px 10px rgba(139, 90, 140, 0.2);
}

/* Buttons */
.bot-options {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 14px;
}
.bot-btn {
  background: white;
  border: 2px solid var(--c-pink-pale);
  color: var(--c-primary);
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  text-align: right;
  transition: all 0.2s;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  box-shadow: 0 1px 4px rgba(139, 90, 140, 0.05);
}
.bot-btn:hover {
  background: linear-gradient(135deg, #d97a8c 0%, #e8b86a 100%);
  border-color: transparent;
  color: white;
  transform: translateX(-3px);
  box-shadow: 0 4px 14px rgba(217, 122, 140, 0.3);
}
.bot-btn .arrow { font-size: 18px; }
.bot-btn.back {
  border-color: #e8dde0;
  color: var(--c-text-soft);
  font-size: 13px;
  padding: 10px 14px;
  background: rgba(255,255,255,0.6);
}
.bot-btn.back:hover {
  background: #f0e6ea;
  color: #6b5a6c;
  transform: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.bot-btn.link-btn {
  background: linear-gradient(135deg, #e8b86a 0%, #d97a8c 100%);
  color: white;
  border: none;
  font-weight: 700;
}
.bot-btn.link-btn:hover {
  background: linear-gradient(135deg, #d97a8c 0%, #8b5a8c 100%);
  color: white;
}

/* Hero illustration */
.center-hero {
  width: calc(100% + 36px);
  margin: -16px -18px 16px -18px;
  height: 160px;
  border-radius: 22px 22px 0 0;
  overflow: hidden;
  position: relative;
}

/* Sections */
.section-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 700;
  color: var(--c-coral);
  margin: 18px 0 10px 0;
  padding-bottom: 6px;
  border-bottom: 2px dashed var(--c-pink-pale);
}
.section-label i { font-size: 16px; }

.places-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin: 8px 0;
}
.place-chip {
  background: linear-gradient(135deg, #fef7f0 0%, #fdf0ed 100%);
  border: 1.5px solid var(--c-pink-pale);
  padding: 11px 14px;
  border-radius: 14px;
  font-size: 13.5px;
  font-weight: 500;
  color: #4a3848;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: transform 0.15s;
}
.place-chip:hover {
  transform: translateX(-3px);
  border-color: var(--c-coral);
}
.place-chip .chip-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, #d97a8c 0%, #e8b86a 100%);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.place-chip .chip-icon i {
  color: white;
  font-size: 16px;
}

.contact-card {
  background: linear-gradient(135deg, #fef7f0 0%, #fde5ec 100%);
  border-radius: 16px;
  padding: 14px 16px;
  margin: 12px 0 8px 0;
  border: 1.5px solid var(--c-pink-pale);
}
.contact-card .name {
  font-size: 15px;
  font-weight: 700;
  color: var(--c-primary);
  margin-bottom: 8px;
}
.contact-row {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 13.5px;
  color: #4a3848;
  padding: 4px 0;
  font-weight: 500;
}
.contact-row i {
  color: var(--c-coral);
  font-size: 16px;
  width: 16px;
}

.note-box {
  background: linear-gradient(135deg, #fff8e8 0%, #fde9d9 100%);
  border: 1.5px solid #f5d4a3;
  padding: 12px 14px;
  border-radius: 14px;
  margin: 12px 0;
  font-size: 13.5px;
  color: #6b4a0a;
  font-weight: 500;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.note-box i {
  color: #c9a040;
  font-size: 18px;
  margin-top: 1px;
  flex-shrink: 0;
}

.staff-card {
  background: white;
  border: 1.5px solid var(--c-pink-pale);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  gap: 14px;
  box-shadow: 0 2px 10px rgba(139, 90, 140, 0.05);
}
.staff-card .staff-icon {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  flex-shrink: 0;
  background: linear-gradient(135deg, #d97a8c 0%, #e8b86a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 10px rgba(217, 122, 140, 0.25);
}
.staff-card .staff-icon i {
  color: white;
  font-size: 28px;
}
.staff-card .info { flex: 1; min-width: 0; }
.staff-card .info h5 {
  margin: 0 0 3px 0;
  color: var(--c-primary);
  font-size: 16px;
  font-weight: 700;
}
.staff-card .role {
  font-size: 12px;
  color: var(--c-text-muted);
  margin-bottom: 10px;
  font-weight: 500;
}

.welcome-emoji {
  font-size: 22px;
  display: inline-block;
  animation: float 2s ease-in-out infinite;
}

/* Footer */
.footer {
  padding: 12px 20px;
  text-align: center;
  font-size: 11px;
  color: var(--c-text-muted);
  background: rgba(255,255,255,0.5);
  border-top: 1px solid var(--c-pink-pale);
}
.footer a {
  color: var(--c-primary);
  text-decoration: none;
  font-weight: 500;
}
.footer a:hover { text-decoration: underline; }

/* Mobile - tablets and smaller */
@media (max-width: 768px) {
  .page-wrapper { padding: 0; }
  #bot-wrapper {
    border-radius: 0;
    min-height: 100vh;
    max-width: 100%;
    box-shadow: none;
  }
  #chat-area {
    height: calc(100dvh - 145px);
    min-height: calc(100dvh - 145px);
    padding: 1rem 0.875rem;
  }
  .header { padding: 0.875rem 1rem; gap: 8px; }
  .header .logo-box {
    width: 40px;
    height: 40px;
    border-radius: 11px;
  }
  .header .logo-box svg { width: 26px; height: 26px; }
  .header .titles p { font-size: 13px; line-height: 1.25; }
  .header .titles p.sub { font-size: 10px; line-height: 1.25; }
  .header .titles.left p { font-size: 11px; }

  .bot-msg { gap: 8px; margin-bottom: 14px; }
  .avatar-mini {
    width: 36px;
    height: 36px;
    border-width: 2px;
  }
  .avatar-mini svg { width: 36px; height: 36px; }

  .bot-bubble {
    padding: 14px 14px;
    font-size: 14.5px;
    line-height: 1.65;
    border-radius: 18px 18px 18px 4px;
    max-width: calc(100% - 44px);
  }
  .bot-bubble h4 {
    font-size: 18px;
    margin-bottom: 10px;
  }

  .user-bubble {
    padding: 10px 14px;
    font-size: 14px;
    border-radius: 18px 18px 4px 18px;
    max-width: 85%;
  }

  .center-hero {
    width: calc(100% + 28px);
    margin: -14px -14px 14px -14px;
    height: 130px;
    border-radius: 18px 18px 0 0;
  }

  .section-label {
    font-size: 13px;
    margin: 14px 0 8px 0;
  }

  .place-chip {
    padding: 10px 12px;
    font-size: 13px;
    gap: 9px;
  }
  .place-chip .chip-icon {
    width: 30px;
    height: 30px;
    border-radius: 9px;
  }
  .place-chip .chip-icon i { font-size: 15px; }

  .contact-card {
    padding: 12px 14px;
    border-radius: 14px;
  }
  .contact-card .name { font-size: 14.5px; }
  .contact-row { font-size: 13px; }

  .note-box {
    padding: 10px 12px;
    font-size: 12.5px;
    border-radius: 12px;
  }

  .staff-card {
    padding: 14px;
    gap: 12px;
    border-radius: 16px;
  }
  .staff-card .staff-icon {
    width: 48px;
    height: 48px;
    border-radius: 13px;
  }
  .staff-card .staff-icon i { font-size: 24px; }
  .staff-card .info h5 { font-size: 15px; }
  .staff-card .role { font-size: 11.5px; }

  .bot-btn {
    padding: 11px 14px;
    font-size: 13.5px;
    border-radius: 14px;
    border-width: 1.5px;
  }
  .bot-btn .arrow { font-size: 16px; }
  .bot-btn.back {
    padding: 9px 12px;
    font-size: 12.5px;
  }

  .footer {
    font-size: 10px;
    padding: 10px 14px;
  }
}

/* Extra small mobile - phones under 380px */
@media (max-width: 380px) {
  .header { padding: 0.75rem 0.875rem; }
  .header .titles p { font-size: 12px; }
  .header .titles p.sub { font-size: 9.5px; }
  .header .titles.left { display: none; }
  .bot-bubble { font-size: 14px; padding: 12px 13px; }
  .bot-bubble h4 { font-size: 17px; }
  .center-hero { height: 115px; }
}
</style>
</head>
<body>
<div class="page-wrapper">
<div id="bot-wrapper">

<!-- Header -->
<div class="header">
  <div class="deco1"></div>
  <div class="deco2"></div>

  <div class="logo-wrap">
    <div class="logo-box">
      <svg width="32" height="32" viewBox="0 0 42 42">
        <defs>
          <linearGradient id="logo-g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b5a8c"/>
            <stop offset="1" stop-color="#d97a8c"/>
          </linearGradient>
        </defs>
        <path d="M21 6 C14 6 10 11 10 18 C10 24 14 28 21 28 C28 28 32 24 32 18 C32 11 28 6 21 6 Z" fill="url(#logo-g1)"/>
        <circle cx="21" cy="17" r="3" fill="white"/>
        <path d="M14 24 Q21 28 28 24" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M15 30 L15 36 M27 30 L27 36 M21 28 L21 36" stroke="#e8b86a" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="titles">
      <p>המדור להכשרה מקצועית</p>
      <p class="sub">ביה"ס לעבודה סוציאלית ע"ש פאול ברוואלד</p>
    </div>
  </div>

  <div class="logo-wrap">
    <div class="titles left">
      <p>האוניברסיטה</p>
      <p>העברית</p>
    </div>
    <div class="logo-box">
      <svg width="32" height="32" viewBox="0 0 42 42">
        <defs>
          <linearGradient id="logo-g2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b5a8c"/>
            <stop offset="1" stop-color="#d97a8c"/>
          </linearGradient>
        </defs>
        <path d="M21 5 L34 12 L34 15 L8 15 L8 12 Z" fill="url(#logo-g2)"/>
        <rect x="11" y="17" width="3" height="13" rx="1" fill="url(#logo-g2)"/>
        <rect x="19.5" y="17" width="3" height="13" rx="1" fill="url(#logo-g2)"/>
        <rect x="28" y="17" width="3" height="13" rx="1" fill="url(#logo-g2)"/>
        <rect x="7" y="32" width="28" height="3" rx="1" fill="url(#logo-g2)"/>
        <path d="M21 3 L23 7 L21 9 L19 7 Z" fill="#e8b86a"/>
      </svg>
    </div>
  </div>
</div>

<!-- Chat area -->
<div id="chat-area">
  <div id="messages"></div>
  <div id="typing">
    <div class="avatar-mini"></div>
    <div class="bubble">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </div>
</div>

<div class="footer">
  בוט מידע © המדור להכשרה מקצועית · בית הספר לעבודה סוציאלית ולרווחה חברתית · האוניברסיטה העברית בירושלים
</div>

</div>
</div>

<script>
// ===================== Avatars =====================
// Maya - young modern student-style avatar
function makeAvatar(size) {
  size = size || 44;
  const uid = 'av' + size + Math.random().toString(36).slice(2, 7);
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="bg-${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fef0d9"/>
        <stop offset="1" stop-color="#fde5ec"/>
      </linearGradient>
      <linearGradient id="hair-${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6b3a1f"/>
        <stop offset="1" stop-color="#4a2614"/>
      </linearGradient>
      <linearGradient id="shirt-${uid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#d97a8c"/>
        <stop offset="1" stop-color="#e8b86a"/>
      </linearGradient>
      <radialGradient id="cheek-${uid}" cx="0.5" cy="0.5">
        <stop offset="0" stop-color="#ff8fa3" stop-opacity="0.7"/>
        <stop offset="1" stop-color="#ff8fa3" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- background circle -->
    <circle cx="50" cy="50" r="50" fill="url(#bg-${uid})"/>
    <!-- shoulders/T-shirt -->
    <path d="M12 100 Q12 70 50 70 Q88 70 88 100 Z" fill="url(#shirt-${uid})"/>
    <!-- T-shirt neckline -->
    <path d="M42 70 Q50 76 58 70 L58 74 Q50 80 42 74 Z" fill="#c45a70"/>
    <!-- neck -->
    <path d="M44 63 Q44 70 50 70 Q56 70 56 63 Z" fill="#e8a880"/>
    <!-- face - rounder/younger -->
    <ellipse cx="50" cy="46" rx="22" ry="23" fill="#f5c89a"/>
    <!-- side ponytail (right side) -->
    <ellipse cx="76" cy="44" rx="9" ry="14" fill="url(#hair-${uid})" transform="rotate(15 76 44)"/>
    <!-- hair bun base (top) -->
    <ellipse cx="58" cy="22" rx="12" ry="8" fill="url(#hair-${uid})"/>
    <!-- hair main mass - youthful bangs and side -->
    <path d="M28 44 Q26 22 42 16 Q50 13 58 14 Q70 16 72 32 Q72 38 70 42 Q67 32 60 30 Q54 28 48 30 Q40 32 34 38 Q30 42 28 48 Z" fill="url(#hair-${uid})"/>
    <!-- side bang -->
    <path d="M30 38 Q34 28 44 26 Q42 32 36 36 Q33 38 30 42 Z" fill="url(#hair-${uid})"/>

// ===================== Bot Logic =====================
const messagesEl = document.getElementById('messages');
const chatArea = document.getElementById('chat-area');
const typingEl = document.getElementById('typing');

function initAvatars() {
  document.querySelectorAll('#typing .avatar-mini').forEach(el => {
    if (!el.innerHTML.trim()) el.innerHTML = makeAvatar(44);
  });
}

function scrollDown() {
  setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
}

// Scroll the new bot message to the TOP of the visible area
// so user sees the heading/hero image first, not the buttons at the bottom
function scrollToMessage(el) {
  if (!el) return;
  setTimeout(() => {
    const containerTop = chatArea.getBoundingClientRect().top;
    const msgTop = el.getBoundingClientRect().top;
    const offset = msgTop - containerTop + chatArea.scrollTop - 12;
    chatArea.scrollTo({ top: offset, behavior: 'smooth' });
  }, 80);
}

function showTyping() {
  initAvatars();
  typingEl.style.display = 'flex';
  scrollDown();
}

function hideTyping() {
  typingEl.style.display = 'none';
}

function openLink(url) {
  window.open(url, '_blank', 'noopener,noreferrer');
}

function botMessage(html, options, delay) {
  delay = delay || 700;
  showTyping();
  setTimeout(() => {
    hideTyping();
    const msg = document.createElement('div');
    msg.className = 'bot-msg';
    let optsHtml = '';
    if (options && options.length) {
      optsHtml = '<div class="bot-options">' + options.map(o => {
        if (o.url) {
          return `<button class="bot-btn link-btn" onclick="openLink('${o.url}')">
            <span>${o.label}</span>
            <i class="ti ti-external-link arrow"></i>
          </button>`;
        }
        return `<button class="bot-btn ${o.back ? 'back' : ''}" onclick="handleChoice('${o.value}')">
          <span>${o.label}</span>
          <i class="ti ti-${o.back ? 'arrow-right' : 'chevron-left'} arrow"></i>
        </button>`;
      }).join('') + '</div>';
    }
    msg.innerHTML = `
      <div class="avatar-mini">${makeAvatar(44)}</div>
      <div class="bot-bubble">${html}${optsHtml}</div>
    `;
    messagesEl.appendChild(msg);
    // Scroll so the TOP of the new message is visible (heading + hero image first)
    scrollToMessage(msg);
  }, delay);
}

function userMessage(text) {
  const msg = document.createElement('div');
  msg.className = 'user-msg';
  msg.innerHTML = `<div class="user-bubble">${text}</div>`;
  messagesEl.appendChild(msg);
  scrollDown();
}

      { label: "חזרה לתפריט הראשי", value: "main", back: true }

  );
}

function showCenterInfo(track, centerId) {

  let noteHtml = '';

    noteHtml = `<div class="note-box"><i class="ti ti-info-circle"></i><span>${info.note}</span></div>`;

  const subtitle = info.subtitle ? `<p style="font-size: 13px; color: #8a7a85; margin: -8px 0 12px 0; font-weight: 500;">${info.subtitle}</p>` : '';

     <p>${info.desc}</p>

     ${noteHtml}

       <div class="name">${info.coordinator}</div>
       <div class="contact-row"><i class="ti ti-phone"></i> ${info.phone}</div>
       <div class="contact-row"><i class="ti ti-mail"></i> ${info.email}</div>
     </div>`,
    [

      { label: "חזרה לרשימת המרכזים", value: `back:${track}`, back: true },
      { label: "חזרה לתפריט הראשי", value: "main", back: true }

}

function handleChoice(value) {
  if (value === 'general') {
    userMessage("מידע כללי על המדור");
    botMessage(data.general.content, [
      { label: "למידע נוסף באתר ביה\"ס", url: data.general.link },
      { label: "חזרה לתפריט הראשי", value: "main", back: true }
    ]);
  } else if (value === 'partani') {
    userMessage("המגמה הפרטנית");
    showCenters('partani');
  } else if (value === 'kehilatit') {
    userMessage("המגמה הקהילתית");
    showCenters('kehilatit');
  } else if (value === 'contact') {
    userMessage("יצירת קשר עם המדור");
    showContact();
  } else if (value === 'main') {
    showMainMenu();
  } else if (value.startsWith('back:')) {
    const track = value.split(':')[1];
    showCenters(track);
  } else if (value.startsWith('center:')) {
    const [, track, centerId] = value.split(':');
    const center = data[track].centers.find(c => c.id === centerId);
    userMessage(center.name);
    showCenterInfo(track, centerId);
  }
}
